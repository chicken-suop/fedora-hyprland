# SSH configuration for environment cloning
# This enables consistent remote experience with local tools

# Default configuration for all hosts
hostname *
env EDITOR=code
env VISUAL=code

# Copy fish configuration to remote hosts
copy --dest ~/.config/fish/config.fish ~/.config/fish/config.fish
copy --dest ~/.config/fish/functions/ ~/.config/fish/functions/

# Copy starship config if it exists
copy --glob --dest ~/.config/ ~/.config/starship.toml

# Environment variables for development
env LANG=en_AU.UTF-8
env LC_ALL=en_AU.UTF-8
