# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# Monitor configuration
# ASUS PG27AQDP - Primary monitor at 2K 360Hz
monitor=DP-5,2560x1440@359.98,0x0,1

# Dell P2422H - Secondary monitor to the left, rotated 90 degrees (portrait)
monitor=HDMI-A-2,1920x1080@60,-1080x0,1,transform,1

# Fix for phantom/static cursor on second monitor
cursor {
    no_hardware_cursors = true
}