general {
    col.active_border = rgba(88929eAA)
    col.inactive_border = rgba(3e4852AA)
}

misc {
    background_color = rgba(0f1419FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(0f1419FF)
        col.text = rgba(dee3ebFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(dee3eb), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(dee3eb), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(dee3eb), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(c9cc6eAA) rgba(c9cc6e77),pinned:1
